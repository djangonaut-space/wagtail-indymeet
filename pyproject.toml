[project]
name = "djangonaut_space"
version = "1.0.0"
requires-python = ">=3.13"
urls = {homepage = "https://github.com/djangonaut-space/wagtail-indymeet"}
dependencies = [
    "Django==6.0.*",
    "wagtail>=7.2",
    "django-storages",
    "psycopg[binary]",
    "django-anymail",
    "six",
    "django-recaptcha>=4",
    "python-dotenv",
    "puput",
    "urllib3",
    "django-extensions",
    "django-debug-toolbar",
    "typing-extensions",
    "distlib", # Required for django-tailwind
    "django-tailwind",
    "sentry-sdk[django]",
    "supervisor",
    "django-widget-tweaks",
    "dj-database-url",
    "gunicorn",
    "django-filter>=25.2",
    "django-tasks",
    "django-tasks-db",
    "django-import-export",
    "gdal<3.14",
    "wagtailgeowidget",
    "djangorestframework-gis",
    "icalendar",
    "requests>=2.34.2",
    "pygithub>=2.10.0",
    "django-crontask",
]

[tool.uv.sources]
# puput 2.2.0 pins wagtail<7.0 with no official release supporting Wagtail 7.x yet.
# Use the community fork's wagtail-7-support branch (unmerged as of 2026-08) until
# https://github.com/APSL/puput/pull/307 lands upstream.
puput = { git = "https://github.com/hoheinzollern/puput", rev = "cd874e9a207d88cdae0ff8b86f3f9e599f1acbc7" }

[dependency-groups]
test = [
    "freezegun",
    "playwright",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-mock",
    "pytest-playwright",
    "factory_boy",
    "unittest_parametrize",
    "faker",
    "responses>=0.26.3",
    "pytest-xdist>=3.8.0",
]
dev = [
    "pre-commit",
    "django-tailwind[reload]",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "indymeet.settings"
addopts = "--reuse-db -m 'not playwright'"
markers = [
    "playwright: mark test that requires playwright",
]

[tool.coverage.run]
branch = true
parallel = true
source = [
    "accounts",
    "home",
    "indymeet",
]

[tool.coverage.paths]
source = [
    "accounts",
    "home",
    "indymeet",
]

[tool.coverage.report]
show_missing = true
