[project]
name = "djangonaut_space"
version = "1.0.0"
requires-python = ">=3.11"
urls = {homepage = "https://github.com/djangonaut-space/wagtail-indymeet"}
dependencies = [
    "Django==5.2.*",
    "wagtail",
    "django-storages",
    "psycopg[binary]",
    "django-anymail",
    "six",
    "django-recaptcha>=4",
    "python-dotenv",
    "puput",
    "urllib3",
    "django-extensions",
    "django-debug-toolbar",
    "typing-extensions",
    "distlib", # Required for django-tailwind
    "django-tailwind",
    "sentry-sdk[django]",
    "supervisor",
    "django-widget-tweaks",
    "dj-database-url",
    "gunicorn",
    "django-filter>=25.2",
    "django-tasks",
    "django-tasks-db",
    "django-import-export",
    "gdal<3.11",
    "wagtailgeowidget",
    "djangorestframework-gis",
    "icalendar",
    "requests>=2.34.2",
    "pygithub>=2.9.1",
]

[dependency-groups]
test = [
    "freezegun",
    "playwright",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-mock",
    "pytest-playwright",
    "factory_boy",
    "unittest_parametrize",
    "faker",
    "responses>=0.26.2",
    "pytest-xdist>=3.8.0",
]
dev = [
    "pre-commit",
    "django-tailwind[reload]",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "indymeet.settings"
addopts = "--reuse-db -m 'not playwright'"
markers = [
    "playwright: mark test that requires playwright",
]
filterwarnings = [
    "ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated:django.utils.deprecation.RemovedInDjango60Warning",
    "ignore:The usage of `WidgetWithScript` hook is deprecated:wagtail.utils.deprecation.RemovedInWagtail70Warning",
    "ignore:'locale.getdefaultlocale' is deprecated and slated for removal in Python 3.15:DeprecationWarning:l18n.translation",
    "ignore:The usage of get_prefetch_queryset\\(\\):django.utils.deprecation.RemovedInDjango60Warning",
]

[tool.coverage.run]
branch = true
parallel = true
source = [
    "accounts",
    "home",
    "indymeet",
]

[tool.coverage.paths]
source = [
    "accounts",
    "home",
    "indymeet",
]

[tool.coverage.report]
show_missing = true
