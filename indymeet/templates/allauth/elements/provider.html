{% load i18n %}
{% comment %}
    A button rather than a link: posting goes straight to the provider,
    without allauth's "you are about to sign in" confirmation page.
{% endcomment %}
<li>
    <form method="post" action="{{ attrs.href }}">
        {% csrf_token %}
        <button type="submit"
                class="flex w-full cursor-pointer items-center justify-center gap-3 rounded bg-gray-900 px-4 py-3 font-medium text-white transition-colors hover:bg-gray-700">
            {% include "socialaccount/snippets/provider_icon.html" with provider_id=attrs.provider_id %}
            <span>{% blocktranslate with name=attrs.name %}Continue with {{ name }}{% endblocktranslate %}</span>
        </button>
    </form>
</li>
