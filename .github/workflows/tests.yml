name: Run tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  build:
    env:
      ENVIRONMENT: 'production'
      DATABASE_URL: "postgis://djangonaut:djangonaut@localhost:5432/djangonaut-space"
      DATABASE_SSL: 'false'
      DEBUG: 'False'
      SECRET_KEY: "hunter2"
      RECAPTCHA_PUBLIC_KEY: "dummy_value"
      RECAPTCHA_PRIVATE_KEY: "dummy_value"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      TASK_BACKEND: "django_tasks.backends.immediate.ImmediateBackend"
      STATICFILES_BACKEND: "django.contrib.staticfiles.storage.StaticFilesStorage"
    # Pinned because the ubuntugis PPA, which provides the GDAL version the
    # gdal Python package is pinned to, has no Ubuntu 26.04 release.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      pg:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: "djangonaut"
          POSTGRES_PASSWORD: "djangonaut"
          POSTGRES_DB: "djangonaut-space"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update
          sudo apt-get install -y libgdal-dev g++ gdal-bin libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'theme/static_src/package.json'
          cache: 'npm'
          cache-dependency-path: 'theme/static_src/package-lock.json'

      - name: Install python dependencies
        run: |
          uv sync --frozen --group test
          uv run playwright install

      - name: Build Tailwind CSS
        run: |
          npm ci --prefix theme/static_src
          uv run python manage.py tailwind build

      - name: Build test database template
        env:
          TEST_DB_TEMPLATE: template_wagtail_indymeet_test
        run: |
          uv run coverage run manage.py build_test_db_template
          uv run coverage combine

      - name: Run tests
        env:
          TEST_DB_TEMPLATE: template_wagtail_indymeet_test
        run: uv run pytest -n auto --dist loadscope --cov --cov-append --cov-branch --cov-report=xml --cov-report=term

      - name: Run playwright tests
        env:
          TEST_DB_TEMPLATE: template_wagtail_indymeet_test
        run: uv run pytest --tracing retain-on-failure -m playwright -n auto --dist loadscope --cov --cov-branch --cov-report=xml --cov-append --cov-report=term

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        name: Upload playwright traces
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
