name: Run tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  build:
    env:
      ENVIRONMENT: 'production'
      DATABASE_URL: "postgis://djangonaut:djangonaut@localhost:5432/djangonaut-space"
      DATABASE_SSL: 'false'
      DEBUG: 'False'
      SECRET_KEY: "hunter2"
      RECAPTCHA_PUBLIC_KEY: "dummy_value"
      RECAPTCHA_PRIVATE_KEY: "dummy_value"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      TASK_BACKEND: "django_tasks.backends.immediate.ImmediateBackend"
      STATICFILES_BACKEND: "django.contrib.staticfiles.storage.StaticFilesStorage"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      pg:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: "djangonaut"
          POSTGRES_PASSWORD: "djangonaut"
          POSTGRES_DB: "djangonaut-space"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update
          sudo apt-get install -y libgdal-dev g++ gdal-bin libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'theme/static_src/package.json'
          cache: 'npm'
          cache-dependency-path: 'theme/static_src/package.json'

      - name: Install python dependencies
        run: |
          uv sync --frozen --group test
          uv run playwright install

      - name: Build Tailwind CSS
        run: |
          npm ci
          uv run python manage.py tailwind build

      - name: Run tests
        run: uv run pytest -n auto --cov --cov-branch --cov-report=xml --cov-report=term

      - name: Build test database template
        env:
          TEST_DB_TEMPLATE: template_wagtail_indymeet_test
        run: uv run python manage.py build_test_db_template

      - name: Run playwright tests
        env:
          TEST_DB_TEMPLATE: template_wagtail_indymeet_test
        run: uv run pytest --tracing retain-on-failure -m playwright -n auto --cov --cov-branch --cov-report=xml --cov-append --cov-report=term

      - name: Upload results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: Upload playwright traces
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
