name: Django Probe

on:
  schedule:
    # Runs monthly
    - cron: "22 3 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  django-probe:
    # Pinned because the ubuntugis PPA, which provides the GDAL version the
    # gdal Python package is pinned to, has no Ubuntu 26.04 release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update
          sudo apt-get install -y libgdal-dev g++ gdal-bin libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install python dependencies
        run: uv sync --frozen --group test --group dev

      - name: Submit the payload
        env:
          DJANGO_PROBE_TOKEN: ${{ secrets.DJANGO_PROBE_TOKEN }}
        run: uv run --with django-probe django-probe submit .
