{% load i18n %}<select name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
  <option value="" disabled>{% trans "Search and select…" %}</option>
  {% for group_name, group_choices, group_index in widget.optgroups %}
    {% if group_name %}<optgroup label="{{ group_name }}">{% endif %}
    {% for option in group_choices %}{% include option.template_name with widget=option %}{% endfor %}
    {% if group_name %}</optgroup>{% endif %}
  {% endfor %}
</select>
